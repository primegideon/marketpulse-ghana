name: Data Pipeline Ingestion & Sync

on:
  schedule:
    # Runs at 06:00 UTC on the 1st day of every month
    - cron: '0 6 1 * *'
  workflow_dispatch: # Allows manual on-demand execution from GitHub Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  ingest-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install duckdb pandas numpy

      - name: Run HDX Data Ingestion
        run: |
          python scripts/ingest_hdx.py

      - name: Rebuild Analytical Marts
        run: |
          python scripts/build_marts.py

      - name: Synchronize UI DuckDB Data Source
        run: |
          cp agri_ghana.duckdb ui/sources/agri_ghana/agri_ghana.duckdb

      - name: Check for Data Changes
        id: git_check
        run: |
          git status --porcelain
          if [ -n "$(git status --porcelain ui/sources/agri_ghana/agri_ghana.duckdb)" ]; then
            echo "changes_detected=true" >> $GITHUB_OUTPUT
            echo "Changes detected in DuckDB datasets."
          else
            echo "changes_detected=false" >> $GITHUB_OUTPUT
            echo "No data changes detected. Current dataset is up to date."
          fi

      - name: Create Pull Request with New Data
        if: steps.git_check.outputs.changes_detected == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="data-sync/wfp-hdx-$(date +'%Y%m%d-%H%M')"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH_NAME"
          git add -f ui/sources/agri_ghana/agri_ghana.duckdb
          git commit -m "data(sync): automated WFP HDX data ingestion $(date +'%Y-%m-%d')

          - Downloaded latest food price records and market directory from HDX.
          - Rebuilt analytical staging views and mart aggregates.
          - Synchronized agri_ghana.duckdb into UI source directory.

          Co-authored-by: Emmanuel-Twumasi-Kwame-Yeboah <evandery7@gmail.com>"

          git push origin "$BRANCH_NAME"

          gh pr create \
            --base main \
            --head "$BRANCH_NAME" \
            --title "data(sync): automated WFP HDX food price update ($(date +'%B %Y'))" \
            --body "### Automated Data Ingestion Summary

          This Pull Request was automatically generated by the [Data Pipeline Ingestion & Sync](https://github.com/primegideon/marketpulse-ghana/actions) workflow.

          #### Actions Performed:
          - Retrieved latest WFP food price dataset and market reference from the Humanitarian Data Exchange (HDX).
          - Executed \`scripts/ingest_hdx.py\` and logged operational metrics to \`meta_pipeline_runs\`.
          - Executed \`scripts/build_marts.py\` to update analytical marts and dimensional models.
          - Synchronized DuckDB database into Evidence UI data sources.

          #### Review Instructions:
          1. Verify the automated **Vercel Preview Deployment** generated for this PR.
          2. Inspect updated charts, regional spreads, and commodity price trends in the preview.
          3. Merge this PR to deploy the new data to the live production dashboard at [marketpulse-ghana.vercel.app](https://marketpulse-ghana.vercel.app).

          Co-authored-by: Emmanuel-Twumasi-Kwame-Yeboah <evandery7@gmail.com>"
